url: https://beckyfisher.github.io/FSSgam_package/

template:
  bootstrap: 5

repo:
  url:
    home: https://github.com/beckyfisher/FSSgam_package/
    source: https://github.com/beckyfisher/FSSgam_package/blob/HEAD/
    issue: https://github.com/beckyfisher/FSSgam_package/issues/

navbar:
  structure:
    left:  [home, reference]
    right: [search, github]

reference:
- title: Package overview
  contents:
  - FSSgam-package

- title: Core functions
  desc: >
    Build a candidate model set from a test fit and predictor list, then fit
    and compare that model set by AICc.
  contents:
  - generate_model_set
  - fit_model_set

- title: All-in-one wrapper
  desc: >
    One-shot wrapper around generate_model_set() and fit_model_set();
    recommended only for small candidate sets since it does not let you
    inspect the model set before fitting.
  contents:
  - full.subsets.gam

- title: Correlation diagnostics
  contents:
  - check.correlations
  - check.non.linear.correlations

- title: Supporting functions
  desc: >
    Used internally by full.subsets.gam() and fit_model_set(). Exported but
    not intended to be called directly.
  contents:
  - wi
  - extract.mod.dat
  - build.inclusion.mat
  - fit.mod.l

- title: Deprecated aliases
  desc: >
    Legacy dot.case names retained for backward compatibility. These are the
    function names cited in Fisher et al. (2018, Ecology and Evolution) and
    used by existing downstream code. New code should call the snake_case
    functions above directly.
  contents:
  - generate.model.set
  - fit.model.set

- title: Datasets
  contents:
  - case_study1
  - case_study2
  - case_study3
  - coral_data
